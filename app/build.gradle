plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.yoshikan.walkman'
    compileSdk 36

    defaultConfig {
        applicationId 'com.yoshikan.walkman'
        minSdk 24
        targetSdk 36
        versionCode 5
        versionName '3.1'
        manifestPlaceholders = [redirectSchemeName: 'walkmanul', redirectHostName: 'callback', redirectPathPattern: '.*']
    }

    buildFeatures { buildConfig true }

    flavorDimensions 'edicion'
    productFlavors {
        // Tu versión: incluye Spotify directo (máx. 5 usuarios por reglas de Spotify)
        personal {
            dimension 'edicion'
            applicationId 'com.yoshikan.walkman'
            resValue 'string', 'app_name', 'Walkman UL'
        }
        // Versión para Google Play: solo control universal, sin Spotify
        tienda {
            dimension 'edicion'
            applicationId 'com.yoshikan.casetera'
            resValue 'string', 'app_name', 'Casetera Retro'
        }
    }

    signingConfigs {
        release {
            storeFile file('../walkman.jks')
            storePassword 'walkman123'
            keyAlias 'walkman'
            keyPassword 'walkman123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    personalImplementation fileTree(dir: 'libs', include: ['*.aar'])
    personalImplementation 'com.google.code.gson:gson:2.10.1'
    personalImplementation 'com.spotify.android:auth:2.1.1'
}
